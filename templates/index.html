<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Check</title>
<style>
  :root{
    --bg:#1b1918;
    --surface:#242220;
    --surface-2:#2e2b28;
    --line:#3a3631;
    --text:#ede8e0;
    --muted:#9c948a;
    --good:#8fa888;
    --flag:#c1443c;
    --gold:#c9a227;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
  }
  .card{
    width:100%;
    max-width:460px;
  }
  .eyebrow{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:10px;
  }
  .arc{
    width:16px; height:16px;
    flex-shrink:0;
  }
  h1{
    font-family:"Arial Narrow",Helvetica,Arial,sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.02em;
    font-size:42px;
    line-height:.95;
    margin:0 0 6px;
  }
  .sub{
    color:var(--muted);
    font-size:15px;
    line-height:1.5;
    margin:0 0 32px;
    max-width:36ch;
  }
  .flash{
    background:rgba(193,68,60,.12);
    border:1px solid rgba(193,68,60,.4);
    color:#e39089;
    font-size:13.5px;
    padding:10px 14px;
    border-radius:8px;
    margin-bottom:20px;
  }
  fieldset{ border:none; padding:0; margin:0 0 20px; }
  legend{
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    padding:0 0 10px;
  }
  .picks{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .pick{
    position:relative;
  }
  .pick input{
    position:absolute;
    opacity:0;
    inset:0;
    cursor:pointer;
    margin:0;
  }
  .pick label{
    display:block;
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:10px;
    padding:16px 14px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .pick svg{ display:block; margin-bottom:10px; color:var(--muted); transition:color .15s ease; }
  .pick .name{
    font-family:"Arial Narrow",Helvetica,Arial,sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.02em;
    font-size:16px;
  }
  .pick input:checked + label{
    border-color:var(--gold);
    background:var(--surface-2);
  }
  .pick input:checked + label svg{ color:var(--gold); }
  .pick input:focus-visible + label{ outline:2px solid var(--gold); outline-offset:2px; }

  .drop{
    border:1.5px dashed var(--line);
    border-radius:10px;
    background:var(--surface);
    padding:26px 16px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .drop.drag{ border-color:var(--gold); background:var(--surface-2); }
  .drop{ position:relative; }
  .drop input{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    cursor:pointer;
    margin:0;
  }
  .drop-label{
    font-size:14px;
    color:var(--text);
  }
  .drop-hint{
    font-size:12.5px;
    color:var(--muted);
    margin-top:4px;
  }
  .filename{
    margin-top:10px;
    font-size:13px;
    color:var(--gold);
    word-break:break-all;
  }

  button{
    width:100%;
    margin-top:24px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:var(--gold);
    color:#1b1918;
    font-family:"Arial Narrow",Helvetica,Arial,sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:15px;
    cursor:pointer;
    transition:filter .15s ease;
  }
  button:hover{ filter:brightness(1.08); }
  button:focus-visible{ outline:2px solid var(--text); outline-offset:3px; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">
      <svg class="arc" viewBox="0 0 16 16" fill="none"><path d="M2 13.5A8 8 0 0 1 12.5 3" stroke="currentColor" stroke-width="1.4"/><path d="M2 13.5v-3M2 13.5h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      Local analysis
    </div>
    <h1>Form Check</h1>
    <p class="sub">Pick your lift, drop the clip. Runs entirely on this machine.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('analyze') }}" method="post" enctype="multipart/form-data" id="form">
      <fieldset>
        <legend>Exercise</legend>
        <div class="picks">
          {% for key, spec in exercises.items() %}
          <div class="pick">
            <input type="radio" name="exercise" id="ex-{{ key }}" value="{{ key }}" {% if loop.first %}checked{% endif %} required>
            <label for="ex-{{ key }}">
              {% if key == 'squat' %}
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="2" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v4l-3 3v6M12 11l3 3v6M6 17h3M15 17h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              {% else %}
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="2" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v6M12 9l-4-3M12 9l4-3M12 13l-3 6M12 13l3 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              {% endif %}
              <span class="name">{{ spec.label }}</span>
            </label>
          </div>
          {% endfor %}
        </div>
      </fieldset>

      <fieldset>
        <legend>Video</legend>
        <label class="drop" id="drop" for="video">
          <input type="file" name="video" id="video" accept="video/*" required>
          <div class="drop-label">Drag a clip here, or click to browse</div>
          <div class="drop-hint">.mp4 · .mov · .avi</div>
          <div class="filename" id="filename"></div>
        </label>
      </fieldset>

      <button type="submit">Run analysis</button>
    </form>
  </div>

  <script>
    const drop = document.getElementById('drop');
    const input = document.getElementById('video');
    const filename = document.getElementById('filename');

    input.addEventListener('change', () => {
      filename.textContent = input.files.length ? input.files[0].name : '';
    });
    ['dragenter','dragover'].forEach(evt =>
      drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.add('drag'); })
    );
    ['dragleave','drop'].forEach(evt =>
      drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.remove('drag'); })
    );
    drop.addEventListener('drop', e => {
      if (e.dataTransfer.files.length) {
        input.files = e.dataTransfer.files;
        filename.textContent = input.files[0].name;
      }
    });
  </script>
</body>
</html>
