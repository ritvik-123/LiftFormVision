<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Check</title>
<style>
  :root{
    --bg:#1b1918; --surface:#242220; --surface-2:#2e2b28; --line:#3a3631;
    --text:#ede8e0; --muted:#9c948a; --good:#8fa888; --flag:#c1443c; --gold:#c9a227;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px;
  }
  .card{ width:100%; max-width:480px; }
  .eyebrow{ display:flex; align-items:center; gap:8px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
  .arc{ width:16px; height:16px; flex-shrink:0; }
  h1{ font-family:"Arial Narrow",Helvetica,Arial,sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.02em; font-size:42px; line-height:.95; margin:0 0 6px; }
  .sub{ color:var(--muted); font-size:15px; line-height:1.5; margin:0 0 32px; max-width:36ch; }
  .flash{ background:rgba(193,68,60,.12); border:1px solid rgba(193,68,60,.4); color:#e39089; font-size:13.5px; padding:10px 14px; border-radius:8px; margin-bottom:20px; }
  fieldset{ border:none; padding:0; margin:0 0 20px; }
  legend{ font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:0 0 10px; }
  .picks{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pick{ position:relative; }
  .pick input{ position:absolute; opacity:0; inset:0; cursor:pointer; margin:0; }
  .pick label{ display:block; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:16px 14px; cursor:pointer; transition:border-color .15s ease, background .15s ease; }
  .pick svg{ display:block; margin-bottom:10px; color:var(--muted); transition:color .15s ease; }
  .pick .name{ font-family:"Arial Narrow",Helvetica,Arial,sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.02em; font-size:16px; }
  .pick input:checked + label{ border-color:var(--gold); background:var(--surface-2); }
  .pick input:checked + label svg{ color:var(--gold); }
  .pick input:focus-visible + label{ outline:2px solid var(--gold); outline-offset:2px; }
  .drop{ border:1.5px dashed var(--line); border-radius:10px; background:var(--surface); padding:26px 16px; text-align:center; cursor:pointer; transition:border-color .15s ease, background .15s ease; position:relative; }
  .drop.drag{ border-color:var(--gold); background:var(--surface-2); }
  .drop input{ position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; margin:0; }
  .drop-label{ font-size:14px; }
  .drop-hint{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .filename{ margin-top:10px; font-size:13px; color:var(--gold); word-break:break-all; }
  button{ width:100%; margin-top:24px; padding:14px; border:none; border-radius:10px; background:var(--gold); color:#1b1918; font-family:"Arial Narrow",Helvetica,Arial,sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:15px; cursor:pointer; transition:filter .15s ease; }
  button:hover{ filter:brightness(1.08); }
  button:disabled{ opacity:.6; cursor:default; }
  button:focus-visible{ outline:2px solid var(--text); outline-offset:3px; }

  /* live panel */
  .live{ display:none; }
  .live.active{ display:block; }
  .live .stage{ font-size:13px; color:var(--muted); margin-bottom:8px; }
  .bar-track{ height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
  .bar-fill{ height:100%; background:var(--gold); width:0%; transition:width .2s ease; }
  .bar-fill.indeterminate{ width:30%; animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide{ 0%{ margin-left:0%; } 50%{ margin-left:70%; } 100%{ margin-left:0%; } }
  .metric{ margin-top:14px; font-size:13px; color:var(--muted); display:flex; justify-content:space-between; }
  .metric span:last-child{ color:var(--gold); font-variant-numeric:tabular-nums; }

  /* results panel */
  .results{ display:none; }
  .results.active{ display:block; }
  .status{ display:flex; align-items:flex-start; gap:12px; padding:18px 20px; border-radius:12px; margin-bottom:24px; border:1px solid var(--line); }
  .status.ok{ background:rgba(143,168,136,.1); border-color:rgba(143,168,136,.35); }
  .status.fail{ background:rgba(193,68,60,.1); border-color:rgba(193,68,60,.35); }
  .status .dot{ width:10px; height:10px; border-radius:50%; margin-top:6px; flex-shrink:0; }
  .status.ok .dot{ background:var(--good); }
  .status.fail .dot{ background:var(--flag); }
  .status p{ margin:0; font-size:16px; line-height:1.4; }
  .notes{ list-style:none; margin:0 0 20px; padding:0; display:flex; flex-direction:column; gap:8px; }
  .notes li{ display:flex; gap:10px; font-size:14px; color:var(--muted); line-height:1.5; }
  .notes svg{ flex-shrink:0; margin-top:3px; color:var(--gold); }
  .checks{ border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:20px; }
  .check-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 16px; background:var(--surface); border-bottom:1px solid var(--line); }
  .check-row:last-child{ border-bottom:none; }
  .check-row .label{ font-size:14px; text-transform:capitalize; }
  .check-row .right{ display:flex; align-items:center; gap:10px; }
  .check-row .score{ font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .pill{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:3px 9px; border-radius:999px; font-weight:600; }
  .pill.pass{ background:rgba(143,168,136,.16); color:var(--good); }
  .pill.flag{ background:rgba(193,68,60,.16); color:var(--flag); }
  pre{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; font-size:12.5px; color:var(--muted); overflow-x:auto; white-space:pre-wrap; word-break:break-word; }
  .again{ display:inline-flex; align-items:center; gap:6px; color:var(--muted); background:none; border:none; text-decoration:none; font-size:13px; margin-top:20px; cursor:pointer; padding:0; }
  .again:hover{ color:var(--text); }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">
      <svg class="arc" viewBox="0 0 16 16" fill="none"><path d="M2 13.5A8 8 0 0 1 12.5 3" stroke="currentColor" stroke-width="1.4"/><path d="M2 13.5v-3M2 13.5h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      Local analysis
    </div>
    <h1 id="title">Form Check</h1>
    <p class="sub" id="subtitle">Pick your lift, drop the clip. Runs entirely on this machine.</p>

    <div id="flash"></div>

    <form action="{{ url_for('analyze') }}" method="post" enctype="multipart/form-data" id="form">
      <fieldset>
        <legend>Exercise</legend>
        <div class="picks">
          {% for key, spec in exercises.items() %}
          <div class="pick">
            <input type="radio" name="exercise" id="ex-{{ key }}" value="{{ key }}" {% if loop.first %}checked{% endif %} required>
            <label for="ex-{{ key }}">
              {% if key == 'squat' %}
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="2" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v4l-3 3v6M12 11l3 3v6M6 17h3M15 17h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              {% else %}
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="2" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v6M12 9l-4-3M12 9l4-3M12 13l-3 6M12 13l3 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              {% endif %}
              <span class="name">{{ spec.label }}</span>
            </label>
          </div>
          {% endfor %}
        </div>
      </fieldset>

      <fieldset>
        <legend>Video</legend>
        <label class="drop" id="drop" for="video">
          <input type="file" name="video" id="video" accept="video/*" required>
          <div class="drop-label">Drag a clip here, or click to browse</div>
          <div class="drop-hint">.mp4 · .mov · .avi</div>
          <div class="filename" id="filename"></div>
        </label>
      </fieldset>

      <button type="submit" id="submit">Run analysis</button>
    </form>

    <div class="live" id="live">
      <div class="stage" id="stage-label">Starting…</div>
      <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
      <div id="metrics"></div>
    </div>

    <div class="results" id="results">
      <div id="results-body"></div>
      <button class="again" id="again">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Analyze another
      </button>
    </div>
  </div>

<script>
  const form = document.getElementById('form');
  const submitBtn = document.getElementById('submit');
  const dropZone = document.getElementById('drop');
  const videoInput = document.getElementById('video');
  const filenameEl = document.getElementById('filename');
  const flashEl = document.getElementById('flash');
  const liveEl = document.getElementById('live');
  const stageLabel = document.getElementById('stage-label');
  const bar = document.getElementById('bar');
  const metricsEl = document.getElementById('metrics');
  const resultsEl = document.getElementById('results');
  const resultsBody = document.getElementById('results-body');
  const subtitle = document.getElementById('subtitle');
  const againBtn = document.getElementById('again');

  videoInput.addEventListener('change', () => {
    filenameEl.textContent = videoInput.files.length ? videoInput.files[0].name : '';
  });
  ['dragenter', 'dragover'].forEach(evt =>
    dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.add('drag'); })
  );
  ['dragleave', 'drop'].forEach(evt =>
    dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.remove('drag'); })
  );
  dropZone.addEventListener('drop', e => {
    if (e.dataTransfer.files.length) {
      videoInput.files = e.dataTransfer.files;
      filenameEl.textContent = videoInput.files[0].name;
    }
  });

  function showFlash(msg) {
    flashEl.innerHTML = `<div class="flash">${msg}</div>`;
  }

  function pillRow(key, val, scores) {
    const label = key.replace(/_/g, ' ');
    const score = key in scores ? `<span class="score">${scores[key]}</span>` : '';
    const pillClass = val ? 'flag' : 'pass';
    const pillText = val ? 'Flagged' : 'Clear';
    return `<div class="check-row"><span class="label">${label}</span><div class="right">${score}<span class="pill ${pillClass}">${pillText}</span></div></div>`;
  }

  function renderResult(result) {
    liveEl.classList.remove('active');
    resultsEl.classList.add('active');

    let html = '';
    if (result.ok) {
      html += `<div class="status ok"><span class="dot"></span><p>${result.summary}</p></div>`;
      if (result.notes && result.notes.length) {
        html += '<ul class="notes">' + result.notes.map(n =>
          `<li><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M2 13.5A8 8 0 0 1 12.5 3" stroke="currentColor" stroke-width="1.4"/></svg>${n}</li>`
        ).join('') + '</ul>';
      }
      if (result.flags && Object.keys(result.flags).length) {
        html += '<div class="checks">' + Object.entries(result.flags).map(([k, v]) => pillRow(k, v, result.scores || {})).join('') + '</div>';
      }
    } else {
      html += `<div class="status fail"><span class="dot"></span><p>${result.summary}</p></div><pre>${result.error || ''}</pre>`;
    }
    resultsBody.innerHTML = html;
  }

  function updateProgress(evt) {
    stageLabel.textContent = evt.message || evt.stage || 'Processing…';
    if (evt.total) {
      bar.classList.remove('indeterminate');
      bar.style.width = Math.min(100, (evt.current / evt.total) * 100) + '%';
    } else {
      bar.classList.add('indeterminate');
    }
    if (evt.data) {
      metricsEl.innerHTML = Object.entries(evt.data).map(([k, v]) =>
        `<div class="metric"><span>${k.replace(/_/g, ' ')}</span><span>${v}</span></div>`
      ).join('');
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    flashEl.innerHTML = '';
    resultsEl.classList.remove('active');
    liveEl.classList.add('active');
    bar.style.width = '0%';
    metricsEl.innerHTML = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Analyzing…';

    const formData = new FormData(form);

    try {
      const res = await fetch(form.action, { method: 'POST', body: formData });

      if (!res.ok) {
        const err = await res.json();
        showFlash(err.message || 'Something went wrong.');
        liveEl.classList.remove('active');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Run analysis';
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep the last (possibly partial) line

        for (const line of lines) {
          if (!line.trim()) continue;
          const evt = JSON.parse(line);
          if (evt.type === 'progress') updateProgress(evt);
          else if (evt.type === 'error') {
            showFlash(evt.message);
            liveEl.classList.remove('active');
          } else if (evt.type === 'result') {
            renderResult(evt.result);
          }
        }
      }
    } catch (err) {
      showFlash('Connection lost during analysis.');
      liveEl.classList.remove('active');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Run analysis';
    }
  });

  againBtn.addEventListener('click', () => {
    resultsEl.classList.remove('active');
    form.reset();
    filenameEl.textContent = '';
  });
</script>
</body>
</html>
